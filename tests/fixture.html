<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGMB UI fixture</title>
  <link rel="stylesheet" href="/src/styles.css">
  <style>
    body { margin: 0; background: #fff; color: #202123; font: 16px/1.5 system-ui, sans-serif; }
    html.dark body { background: #212121; color: #ececec; }
    main { width: min(760px, calc(100% - 48px)); margin: 48px auto; }
    .fixture-toolbar { position: sticky; top: 0; z-index: 3; padding: 12px; background: #eee; }
    .fixture-message { position: relative; margin: 20px 0; padding: 18px; border: 1px solid #ccc; border-radius: 12px; }
    .fixture-actions { display: flex; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="fixture-toolbar">
    <nav aria-label="Historie chatu"><button type="button">Nový chat</button></nav>
    <button id="fixture-switch" type="button">Switch conversation</button>
    <button id="fixture-rerender" type="button">Rerender assistant actions</button>
    <button id="fixture-theme" type="button">Toggle dark theme</button>
    <button id="fixture-virtualize" type="button">Unmount messages and scroll away</button>
    <span id="fixture-conversation">test-conversation</span>
  </div>
  <main id="fixture-messages">
    <section class="fixture-message" data-content-search-turn-key="fallback-turn-1" data-turn-key="fixture-turn-1">
    <div data-chatgpt-search-message-ids="user-1">
    <div data-content-search-unit-key="fallback-turn-1:0:user">
      <div data-user-message-bubble="true">
        <p>Ok, Please investigate the BPR loading crash. This message should generate a concise bookmark title.</p>
      </div>
      <div class="fixture-actions turn-action-controls"><span class="contents"><button type="button" aria-label="Zkopírovat zprávu">Copy</button></span></div>
    </div>
    </div>
      <div class="assistant-content" data-content-search-unit-key="fallback-turn-1:3:assistant" data-chatgpt-search-message-ids="assistant-1 assistant-1">
        <h4 class="sr-only" style="position:absolute;opacity:0">ChatGPT řekl:</h4>
        <p>The game now reaches the main menu, but loading a race still crashes after the renderer initializes.</p>
      </div>
      <div class="fixture-actions turn-action-controls"><div><span class="contents"><button type="button" aria-label="Zkopírovat odpověď">Copy</button></span></div></div>
    </section>
  </main>

  <script>
    (function createBrowserMock() {
      const listeners = [];
      const stores = JSON.parse(localStorage.getItem("cgmb-fixture-stores") || "null")
        || { sync: Object.create(null), local: Object.create(null) };
      function area(name) {
        return {
          async get(key) { return { [key]: stores[name][key] }; },
          async set(values) {
            const changes = {};
            Object.entries(values).forEach(([key, value]) => {
              changes[key] = { oldValue: stores[name][key], newValue: value };
              stores[name][key] = value;
            });
            localStorage.setItem("cgmb-fixture-stores", JSON.stringify(stores));
            listeners.forEach((listener) => listener(changes, name));
          },
          async remove(keys) {
            for (const key of Array.isArray(keys) ? keys : [keys]) {
              delete stores[name][key];
            }
            localStorage.setItem("cgmb-fixture-stores", JSON.stringify(stores));
          }
        };
      }
      window.browser = {
        storage: {
          sync: area("sync"),
          local: area("local"),
          onChanged: { addListener(listener) { listeners.push(listener); } }
        }
      };
    })();
  </script>
  <script src="/src/storage.js"></script>
  <script src="/src/messages.js"></script>
  <script src="/src/ui.js"></script>
  <script src="/src/content.js"></script>
  <script>
    document.querySelector('#fixture-virtualize').addEventListener('click', () => {
      const turn = document.querySelector('[data-turn-key="fixture-turn-1"]');
      const content = Array.from(turn.childNodes);
      const height = turn.getBoundingClientRect().height;
      turn.replaceChildren();
      turn.style.minHeight = `${height}px`;
      const spacer = document.createElement('div');
      spacer.style.height = '6000px';
      document.querySelector('main').append(spacer);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
      const observer = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          setTimeout(() => {
            turn.append(...content);
            turn.style.minHeight = '';
            observer.disconnect();
          }, 350);
        }
      });
      observer.observe(turn);
    });
    document.querySelector("#fixture-switch").addEventListener("click", () => {
      const next = location.pathname.endsWith("second-conversation") ? "test-conversation" : "second-conversation";
      history.pushState({}, "", `/c/${next}`);
      document.querySelector("#fixture-conversation").textContent = next;
      document.querySelector("#fixture-messages").append(document.createComment("SPA navigation mutation"));
    });
    document.querySelector("#fixture-rerender").addEventListener("click", () => {
      const actions = document.querySelector('[data-content-search-turn-key="fallback-turn-1"] > .fixture-actions');
      const copy = document.createElement("button");
      copy.type = "button";
      copy.setAttribute("aria-label", "Zkopírovat odpověď");
      copy.textContent = "Copy rerendered";
      const wrapper = document.createElement("span");
      wrapper.className = "contents";
      wrapper.append(copy);
      actions.replaceChildren(wrapper);
    });
    document.querySelector("#fixture-theme").addEventListener("click", () => {
      const html = document.documentElement;
      const dark = !html.classList.contains("dark");
      html.classList.toggle("dark", dark);
      html.classList.toggle("light", !dark);
    });
  </script>
</body>
</html>
